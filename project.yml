name: VoxlPocket
options:
  bundleIdPrefix: com.wongjustin99
  deploymentTarget:
    iOS: "18.0"
packages:
  Sodium:
    url: https://github.com/jedisct1/swift-sodium
    exactVersion: 0.11.0
settings:
  base:
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
schemes:
  VoxlPocket:
    build:
      targets:
        VoxlPocket: all
    test:
      targets: [VoxlPocketTests]
targets:
  VoxlPocket:
    type: application
    platform: iOS
    sources: [Sources]
    dependencies:
      - package: Sodium
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: Voxl
        PRODUCT_BUNDLE_IDENTIFIER: com.wongjustin99.VoxlPocket
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: Voxl Pocket
        ITSAppUsesNonExemptEncryption: false
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: Voxl Pocket connects to computers on your local network that run the voxl server.
        UILaunchScreen: {}
        UIRequiresFullScreen: false
        UIApplicationSupportsIndirectInputEvents: true
        UIStatusBarHidden: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: Default
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).SceneDelegate
  VoxlPocketTests:
    type: bundle.unit-test
    platform: iOS
    sources: [IntegrationTests]
    dependencies:
      - target: VoxlPocket
    settings:
      base:
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/VoxlPocket.app/VoxlPocket
        BUNDLE_LOADER: $(TEST_HOST)
        GENERATE_INFOPLIST_FILE: YES
